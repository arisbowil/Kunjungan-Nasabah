name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. EXTRACT PROJECT ANDROID
      # ==========================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACT ANDROID PROJECT"
          echo "======================================"

          rm -rf android_project
          mkdir -p android_project

          unzip -o "KunjunganNasabah_Android_Project_FIX.zip" \
            -d android_project

          echo ""
          echo "Struktur project:"
          find android_project -maxdepth 5 -type f | sort

          echo ""
          echo "Memeriksa project Android..."

          if [ ! -f "android_project/settings.gradle" ] && \
             [ ! -f "android_project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          if [ ! -d "android_project/app" ]; then
            echo "ERROR: folder app tidak ditemukan!"
            exit 1
          fi

          echo ""
          echo "Project Android ditemukan."

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/android_project" >> "$GITHUB_ENV"


      # ==========================================
      # 3. ENABLE ANDROIDX
      # ==========================================
      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ENABLE ANDROIDX"
          echo "======================================"

          touch "$PROJECT_DIR/gradle.properties"

          if grep -q "^android.useAndroidX=" \
            "$PROJECT_DIR/gradle.properties"; then

            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"

          else

            echo "android.useAndroidX=true" \
              >> "$PROJECT_DIR/gradle.properties"

          fi


          if grep -q "^android.enableJetifier=" \
            "$PROJECT_DIR/gradle.properties"; then

            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"

          else

            echo "android.enableJetifier=true" \
              >> "$PROJECT_DIR/gradle.properties"

          fi


          echo ""
          echo "gradle.properties:"
          cat "$PROJECT_DIR/gradle.properties"


      # ==========================================
      # 4. SETUP JAVA 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 5. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # 6. CHECK GRADLE
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version


      # ==========================================
      # 7. BUILD APK
      # ==========================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD ANDROID APK"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Isi project:"
          ls -la

          echo ""
          echo "Mulai Gradle..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ==========================================
      # 8. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI APK"
          echo "======================================"

          echo ""
          echo "APK yang ditemukan:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/app/build/outputs/apk/debug/*.apk" \
            -print -quit)


          if [ -z "$APK_PATH" ]; then

            echo ""
            echo "ERROR: APK tidak ditemukan!"
            echo ""
            echo "Isi folder build:"
            find "$PROJECT_DIR" \
              -type f \
              | grep -E "build|apk" \
              || true

            exit 1

          fi


          echo ""
          echo "APK ditemukan:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ==========================================
      # 9. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KunjunganNasabah-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ==========================================
      # 10. BUILD SELESAI
      # ==========================================
      - name: Build Complete
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "BUILD APK BERHASIL"
          echo "======================================"
          echo ""
          echo "Nama artifact:"
          echo "KunjunganNasabah-APK"
          echo ""
          echo "APK siap didownload."
