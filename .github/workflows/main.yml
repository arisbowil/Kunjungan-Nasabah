name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o KunjunganNasabah_Android_Project_FIX.zip -d android_project
            - name: Enable AndroidX
        run: |
          if [ -f android_project/gradle.properties ]; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' android_project/gradle.properties
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' android_project/gradle.properties
          else
            touch android_project/gradle.properties
          fi
          grep -q '^android.useAndroidX=' android_project/gradle.properties || echo 'android.useAndroidX=true' >> android_project/gradle.properties
          grep -q '^android.enableJetifier=' android_project/gradle.properties || echo 'android.enableJetifier=true' >> android_project/gradle.properties
    
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle -p android_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KunjunganNasabah-APK
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
